pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
    plugins {
        id 'net.neoforged.moddev' version "${moddev_gradle_version}"
    }
}

rootProject.name = 'livingcities'
