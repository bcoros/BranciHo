org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- Toolchain versions -------------------------------------------------
# Keep these in one place; CI probes maven.neoforged.net and prints the real
# available versions, so a bad pin is a one-line fix.
moddev_gradle_version=2.0.78
minecraft_version=1.21.1
# NeoForge for Minecraft 1.21.1 is the 21.1.x line (LTS).
neoforge_version=21.1.133

# --- Mod metadata -------------------------------------------------------
mod_id=livingcities
mod_name=Living Cities
mod_version=0.1.0
mod_group=com.branciho.livingcities
mod_license=MIT
mod_authors=bcoros
mod_description=Turn the cities you build by hand into living, simulated cities.
