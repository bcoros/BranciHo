pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
    // Version is resolved here so build.gradle can reference the plugin without a
    // literal version, and so the pin lives in gradle.properties.
    plugins {
        id 'net.neoforged.moddev' version "${moddev_gradle_version}"
    }
}

rootProject.name = 'livingcities'
