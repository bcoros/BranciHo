name: Build Living Cities

on:
  push:
    paths:
      - 'livingcities/**'
      - '.github/workflows/livingcities-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The dev container that authors this mod cannot reach maven.neoforged.net,
      # so CI is the source of truth for which toolchain versions actually exist.
      # This step always prints the real available versions, even when the build
      # below fails, which makes a bad version pin a one-line fix.
      - name: Probe available toolchain versions
        continue-on-error: true
        run: |
          echo "::group::NeoForge 21.1.x (Minecraft 1.21.1)"
          curl -sSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | tr '<' '\n' | grep -oE '^21\.1\.[0-9]+' | sort -u -V | tail -25
          echo "::endgroup::"
          echo "::group::ModDevGradle plugin versions"
          curl -sSL https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml \
            | tr '<' '\n' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | sort -u -V | tail -25
          echo "::endgroup::"
          echo "Currently pinned in gradle.properties:"
          grep -E '^(neoforge_version|moddev_gradle_version|minecraft_version)=' livingcities/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle and NeoForge artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            livingcities/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('livingcities/gradle.properties', 'livingcities/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build
        working-directory: livingcities
        run: ./gradlew --no-daemon --stacktrace build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livingcities-jar
          path: livingcities/build/libs/*.jar
          if-no-files-found: warn
