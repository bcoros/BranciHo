name: Build ChatGPT Living Cities

on:
  push:
    branches:
      - 'chatgpt/livingcities-*'
    paths:
      - 'livingcities-chatgpt/**'
      - '.github/workflows/chatgpt-livingcities-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build installable NeoForge jar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            livingcities-chatgpt/.gradle
          key: chatgpt-livingcities-${{ runner.os }}-${{ hashFiles('livingcities-chatgpt/gradle.properties', 'livingcities-chatgpt/*.gradle') }}
          restore-keys: |
            chatgpt-livingcities-${{ runner.os }}-

      - name: Build
        working-directory: livingcities-chatgpt
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload installable jar
        uses: actions/upload-artifact@v4
        with:
          name: livingcities-chatgpt-alpha1-jar
          path: livingcities-chatgpt/build/libs/livingcities-*.jar
          if-no-files-found: error
